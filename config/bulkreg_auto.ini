# =====================================================================
#  BulkReg 4.0.1 - AutoSync configuration  (bulkreg_auto.ini)
#  Used ONLY by the scheduled agent  BulkReg\07 - AutoSync  on a Domino SERVER.
#  The manual agents on the Windows client keep using bulkreg.ini.
#  Same keys, same meaning as bulkreg.ini - the registration logic is the same code.
#  Differences: paths are paths ON THE SERVER (Linux shown; Windows server: use C:\BulkReg\...),
#  the ID files and password files are written on the server, and the [AutoSync] section at the end.
#  key=value, lines starting with # are comments.
#  Replace every <PLACEHOLDER>. Never put passwords in this file. Restrict read access to the
#  Domino service account and the administrators.
#  Point the agent at this file with the notes.ini line  BulkRegAutoConfig=<path of this file>
#  (Linux default if the line is missing: /local/notesdata/bulkreg/config/bulkreg_auto.ini)
# =====================================================================

# Base folder used for any path key left empty below (REQUIRED for AutoSync: a server has no C:\BulkReg)
BaseDir=/local/notesdata/bulkreg/

# ---------------------------------------------------------------------
# NAME FORMATS (examples use the organization "Demo")
#   Servers   : canonical  CN=DominoADMail/O=Demo   or abbreviated  DominoADMail/Demo
#               (both accepted; with an OU: CN=DominoADMail/OU=EMEA/O=Demo)
#   Certifier : Demo (or /Demo, O=Demo) for the organization, Sales/Demo (or OU=Sales/O=Demo) for an OU
#   User names: ALWAYS  First Last/Demo  or  First Last/Sales/Demo  (never .../O=Demo/Demo)
#   Policies  : organizational  */Demo  or  */Sales/Demo  -> applied AUTOMATICALLY at
#                 registration to users under that org / OU (leave Policy empty)
#               explicit        */DirSync-Vault          -> must be named in Policy
# ---------------------------------------------------------------------

# ---------- Directory (names.nsf that DirSync writes into) ----------
# e.g. DirectoryServer=CN=DominoAdmin/O=Demo   or   DirectoryServer=DominoAdmin/Demo
DirectoryServer=<DominoAdmin/Demo>
DirectoryFile=names.nsf

# ---------- Registration ----------
# Server used for registration (the server holding the master Domino Directory)
# e.g. RegistrationServer=CN=DominoAdmin/O=Demo
RegistrationServer=<DominoAdmin/Demo>
# Certification Log. HCL: any non-empty value logs to CERTLOG.NSF in the data directory of the
# registration server; empty = no certification logging. Keep certlog.nsf (recommended for audit).
# (log.nsf is the server's general log - registration does not write its records there.)
RegistrationLog=certlog.nsf

# Certification: UseCA=1 -> Domino server-based CA (your admin ID must be a Registration Authority)
#                UseCA=0 -> certifier ID file (password is prompted at run time, never stored)
UseCA=1
# AutoSync REQUIRES UseCA=1: a certifier ID password cannot be stored for an unattended run.
# The identity that runs the agent must be a Registration Authority of the CA (docs/AUTOSYNC.md S3).
# CA-enabled certifier = the organization (or OU) users are certified under. Any of these forms
# works - BulkReg passes it to the registration as "/Demo" (or "/Sales/Demo"):
#   CertifierName=/Demo     CertifierName=Demo     CertifierName=O=Demo
#   CertifierName=/Sales/Demo   or   CertifierName=OU=Sales/O=Demo   (OU certifier)
# Users are then named  Neha Arora/Demo  (or Neha Arora/Sales/Demo).
# Preflight shows the resulting name; 03 - Register Batch stops at the first wrong name.
CertifierName=<Demo>
# Only when UseCA=0, e.g. CertifierIDFile=C:\BulkReg\cert\demo.id
CertifierIDFile=

# ---------- Domino servers: Linux and/or Windows ----------
# BulkReg runs in the Windows Domino Administrator client; the Domino SERVERS may run Linux, Windows
# or both (mixed). Mail file paths are always RELATIVE to the data directory of the server and are
# sent in the form that server understands:  Linux  mail1/smith.nsf   Windows  mail1\smith.nsf
# The platform of every server is found in this order:
#   1. ServerOSMap  = exceptions per server, "server:OS" comma separated
#        ServerOSMap=DominoADMail/Demo:LINUX,DominoADMail2/Demo:WINDOWS
#   2. detected from the server itself (ServerOSDetect=1, default): the path form it returns for its
#      databases (mail\x.nsf = Windows, mail/x.nsf = Linux/Unix). Preflight logs what it found.
#   3. ServerOS = fallback when the server cannot be detected (no database in a sub folder).
# Preflight warns when ServerOS differs from what a server really is.
ServerOSDetect=1
ServerOS=LINUX
ServerOSMap=
# Data directory, used only in the Preflight mkdir commands (informational):
ServerDataDir=/local/notesdata
ServerDataDirWindows=
# Linux owner of the Domino data (user:group of the server process), for the chown line of the
# Preflight mail folder report. Leave empty to get a <domino-user>:<domino-group> placeholder.
ServerFileOwner=

# ---------- Home servers: automatic distribution of the users ----------
# The mail servers that receive the new users. A user whose mapping rule has AUTO (or an empty)
# home server column gets one server of this list; a rule that names a server still wins.
#   BALANCED (default) = the server with the FEWEST users gets the next user (both fill evenly)
#   FILL (or FILLED)   = fill the first server up to HomeServerMaxUsers, then the next one:
#                        5000 users, max 2500 -> users 1-2500 on the first server, 2501-5000 on the second
# "Users on a server" = users already registered into the NEW mail folders (mail1, mail2 ...) of that
# server + users in OPEN batches + users assigned in this run. A full server is skipped; if all
# are full the user is flagged ERROR (Include=N). 5000 users on 2 servers: max 2500 each.
# Empty HomeServers = old behaviour: everybody goes to DefaultHomeServer (ONE server).
# !! CAPACITY FOR NEW USERS: AutoSync keeps registering users after the initial load. With the defaults
#    (HomeServerMaxUsers=2500 per server, MailFolderMax=3) the two servers are FULL after the 5000 initial users and every
#    new user is flagged "All home servers are full". Before AutoMode=LIVE: raise HomeServerMaxUsers and MailFolderMax to cover
#    the growth you expect and create the extra mail folders (mail4, mail5 ...) on every home server (Preflight lists the commands).
HomeServers=<DominoADMail/Demo>,<DominoADMail2/Demo>
HomeServerMaxUsers=2500
HomeServerAssignment=FILL

# ---------- Registration name: which Person items fill the Domino name fields ----------
# Domino builds the common name (CN=...) from the name fields passed to the registration:
# <FirstName> [<MiddleInitial>] <LastName>.  The LAST NAME is now CONSTRUCTED so it is unique:
#   LastName = <LastNameField value> + <LastNameSeparator> + <suffix>, then UPPER CASE
#   e.g. JobTitle "analyst" + ShortName "jdoe"  ->  ANALYST-JDOE  ->  CN=ANALYST-JDOE/O=Demo
#   LastNameField         Person item used as the source: JobTitle, Department, any other item.
#                         An empty source item = ERROR (user not registered).
#   LastNameSuffixFields  comma list, first usable value wins (no blank, / or =). The token ShortName is the
#                         validated short name (see ShortNameFields); any other token is a Person item,
#                         e.g. sAMAccountName. A user with no usable suffix is an ERROR (name would not be unique).
#                         Empty setting = no suffix at all (not unique - Domino rejects duplicate names).
#   LastNameSeparator     text between source and suffix
#   LastNameUppercase     1 = upper case the final value (default), 0 = keep case
#   LastNameBackupField   Person item that receives a copy of the generated last name after a successful
#                         registration (text). Default Location (not synchronised from AD, so DirSync does not
#                         overwrite it). EMPTY = no backup. Written only after the Notes name was verified.
#   LastNameBackupOverwrite 1 = replace an existing value (the old one is written to the log), 0 = keep it
#                         Location must NOT be used as a MatchField in server_mapping.csv (the run stops if it is).
#   FirstNameField / MiddleNameField  Person items for first name / middle initial. EMPTY = none.
# Preflight shows the resulting name per user in the audit column FullNameAfter (same value as registered).
LastNameField=JobTitle
LastNameSuffixFields=ShortName,sAMAccountName
LastNameSeparator=-
LastNameUppercase=1
LastNameBackupField=Location
LastNameBackupOverwrite=1
FirstNameField=
MiddleNameField=

# ---------- Short name and Internet address (Active Directory) ----------
# AD example:  cn=102939ops  givenname=Abc  sn=xyz  samaccountname=102939ops
#   JobTitle "Sgt Abc xyz" -> Notes name Sgt Abc xyz/Demo | short name 102939ops | Internet address 102939ops@<InternetDomain>
# ShortNameFields = Person document item(s) that hold the AD samaccountname. In this environment
# samaccountname maps to ShortName (a text list): every value is examined and the first one without
# blanks, / or = (and not "First Last") is used. The FullName (the AD cn) is never used as short name;
# if no value qualifies the user is flagged ERROR.
#   ShortNameFields=ShortName          (default)
# Check with 01 - Preflight: the ShortName column of the audit CSV must show 102939ops.
ShortNameFields=ShortName
# Users WITHOUT an Internet address in AD get  <shortname>@<InternetDomain>  (set by the registration
# in the Person document). With ConstructInternetAddress=0 or an empty InternetDomain nothing is
# constructed and SkipNoInternetAddress (below) decides.
ConstructInternetAddress=1
# 0 (default) = an address that AD already has is kept. 1 = ALWAYS use <shortname>@<InternetDomain>, also when AD has an address.
OverrideADInternetAddress=0
InternetDomain=<demo.com>

# ---------- Defaults (overridden per user by server_mapping.csv) ----------
# Home server used only when HomeServers is empty, e.g. DefaultHomeServer=CN=DominoADMail/O=Demo
DefaultHomeServer=<DominoADMail/Demo>
# Optional OU added BETWEEN the person and the certifier: ONE plain OU name, e.g. Sales
#   -> Neha Arora/Sales/Demo.  Leave EMPTY for Neha Arora/Demo.
#   Never O=Demo, OU=Sales or Sales/Demo here: that creates names like Neha Arora/O=Demo/Demo.
DefaultOrgUnit=
# EXPLICIT policy whose Security Settings assign the ID Vault, exactly as listed in the
# Policies view, e.g. DefaultPolicy=*/DirSync-Vault
# Leave EMPTY if an ORGANIZATIONAL policy (*/Demo or */Sales/Demo) assigns the vault
DefaultPolicy=<*/DirSync-Vault>
# 1 = an organizational policy assigns the ID Vault (no explicit policy needed; no warning)
OrgPolicyAssignsVault=0
# Comma separated Domino groups to add users to (optional), e.g. DefaultGroups=BR-Users
DefaultGroups=

ExpirationDays=730
# Password quality/strength value applied to the ID (0-16)
MinPasswordLength=8
IsNorthAmerican=1
EnforceUniqueShortName=1
StoreIDInAddressBook=0
SyncInternetPassword=0

# ---------- Mail files (created for EVERY registered user) ----------
# Each user gets a Domino mail file on his/her HomeServer. All paths are RELATIVE TO THE
# DOMINO DATA DIRECTORY of that server (the Directory= line in its notes.ini).
#
#   <Domino data directory>            /local/notesdata  (Domino on Linux)
#     |-- mail/        EXISTING mail files - left untouched, but their names are checked
#     |                so no duplicate name is created          (MailExistingFolders=mail)
#     |-- mail1/       NEW mail files 1 - 1000 of THIS server    (MailFolderPrefix=mail + 1)
#     |-- mail2/       NEW mail files 1001 - 2000 of THIS server (MailFolderPrefix=mail + 2)
#     |-- mail3/       NEW mail files 2001 - 2500 of THIS server
#     |-- ...          one folder per MailFilesPerFolder (1000) users, up to MailFolderMax
#
#   Person document after registration: MailFile = mail1/smith.nsf   (relative to the data directory)
#   mail1, mail2 ... are created by YOU on every home server BEFORE the first batch (guide B4),
#   directly under /local/notesdata - NOT inside the mail folder. 01 - Preflight writes the exact
#   mkdir/chown commands (_mailfolders.txt).
#   Every home server has its OWN mail1.., filled independently (2500 users = mail1, mail2, mail3
#   on each of the two servers), unless the servers form a mail cluster (MailClusterServers).
#
# Name of the mail file:
#   LASTNAME (default)    -> smith.nsf     (Müller -> mueller.nsf, O'Brien -> obrien.nsf)
#   FIRSTINITIAL_LASTNAME -> jsmith.nsf
#   SHORTNAME             -> <ShortName>.nsf (falls back to LASTNAME)
MailFileNaming=SHORTNAME
# A name is "taken" if it exists in a numbered folder or in MailExistingFolders on that home
# server, is used by a Person document (MailServer + MailFile), or is reserved by an open batch
# or an earlier row of this batch.
#   SUFFIX (default) -> next free name: smith2.nsf, smith3.nsf ...   (shown as WARN in the batch)
#   ERROR            -> the row gets Check=ERROR, Include=N
MailFileCollision=SUFFIX
#
# Folder layout:
#   NUMBERED (default) -> new mail files go to <MailFolderPrefix>1, <MailFolderPrefix>2 ...
#   SINGLE             -> all new mail files go to MailFileDir (e.g. mail)
MailFolderMode=NUMBERED
# Folder name WITHOUT the number and WITHOUT a path: mail -> folders mail1, mail2, mail3 ...
#   (MailFolderPrefix=mail1 or MailFolderPrefix=mail\mail are rejected at start-up)
MailFolderPrefix=mail
# Maximum mail files per numbered folder
MailFilesPerFolder=1000
# Number of numbered folders you PRE-CREATED on every home server (guide B4). No higher folder is assigned.
# Separate servers (no mail cluster): per SERVER. 2500 users per server / 1000 per folder = 3
#   (mail1, mail2, mail3 on each of the two servers).
# Mail cluster: count the users of ALL home servers in the cluster together, because every member
#   holds every mail file (2500 + 2500 = 5000 -> MailFolderMax=5, mail1..mail5 on all members).
MailFolderMax=3
# Existing mail folder(s) (relative to the data directory, comma separated) whose file names are
# checked for uniqueness. Nothing is ever written there by BulkReg in NUMBERED mode.
MailExistingFolders=mail
# Only used when MailFolderMode=SINGLE: the one folder for all new mail files
MailFileDir=mail
# Database title of every new mail file (shown in the Notes workspace / Files tab). Tokens:
#   {CN} = common name (Neha Arora)  {FirstName}  {LastName}  {ShortName}  {InternetAddress}
MailFileTitle={CN}
# 1 = also replace a title the registration already set; 0 = only fill an empty title
MailFileTitleOverwrite=0
# 1 (default) = the registration creates the mail file.
# 0 = the registration does NOT create it; BulkReg creates it right after registering the user, from
#     MailTemplate on the home server (MailTemplate is then REQUIRED), and points the Person document
#     at it. Use 0 if the registration stops with an error after the ID was created.
RegisterCreateMailDb=1
# Mail template on the home servers: the TEMPLATE file name, ending in .ntf (e.g. mail145.ntf - NOT .nsf).
# Preflight checks that it exists on every home server; a wrong name stops the registration.
# (empty = the registration default), e.g. MailTemplate=mail12.ntf
MailTemplate=
# Who gets MANAGER access (with Delete documents) to every new mail file.
#   empty = the admin ID that runs BulkReg (recommended)
#   or names separated by commas, e.g. MailACLManager=Admin User/Demo,LocalDomainAdmins
# BulkReg adds them right after registration, before the cluster replicas are requested (the replicas
# copy the ACL; AdminP also needs your admin ID to have access). Verify checks them and can add missing ones.
MailACLManager=
# Access of the mail file OWNER (the registered user) in his/her mail file:
#   EDITOR (default) = Editor + Delete documents - enough to read, send, file and delete mail
#   DESIGNER / MANAGER = higher levels (Domino's registration default is MANAGER)
# Note: with EDITOR the user cannot change the mail file ACL himself, e.g. via
# Preferences > Access & Delegation; an administrator (MailACLManager) does that.
MailOwnerAccess=EDITOR
# 1 = create a full-text index for each new mail file
MailCreateFTIndex=0
# Mail file size quota and warning threshold in MB (0 = none)
MailQuotaSizeLimit=0
MailQuotaWarningThreshold=0
# 1 = Build Batch and Register Batch refuse a user whose mail file already exists on the home server
#     (or on one of its cluster replica servers)
CheckMailFileExists=1

# ---------- Mail cluster: replicas of every new mail file ----------
# ALL members of the Domino mail cluster, comma separated (2 to 6 servers), e.g. 2 in DC + 2 in DR:
#   MailClusterServers=DominoADMail/Demo,DominoADMail2/Demo,DominoADMailDR1/Demo,DominoADMailDR2/Demo
# Effect for every user whose home server is in this list:
#   - the mail file is created on the home server (registration) and a REPLICA of it is requested
#     on every OTHER member (AdminP "Create Replica", same path e.g. mail1\smith.nsf, ACL copied);
#   - mail file names and folders mail1, mail2 ... are allocated ONCE for the whole cluster, so a
#     name never clashes on any member and every folder holds max MailFilesPerFolder files everywhere.
# Leave EMPTY when there is no mail cluster (no replicas are created).
# A mapping rule can override the replica servers per user (server_mapping.csv, column 8).
MailClusterServers=
# 1 = 03 - Register Batch posts the AdminP "Create Replica" requests (default)
# 0 = no requests (you create the replicas yourself); Agent 04 still reports missing replicas
CreateClusterReplicas=1

# ---------- ID files & initial passwords ----------
# Local folder where the registration writes the user ID files (must exist; secure it!)
IDFileDir=/local/notesdata/bulkreg/ids/
InitialPasswordLength=16
# 1 = write generated initial passwords to a SEPARATE restricted file (needed to hand IDs to users)
# 0 = do not keep passwords (reset later via ID Vault password reset)
WritePasswordFile=1
PasswordDir=/local/notesdata/bulkreg/secure/

# ---------- ID Vault ----------
# Vault server used for post-registration verification (IsIDInVault)
# e.g. VaultServer=DominoVault/Demo   (use the server name as shown in the vault document)
VaultServer=<DominoVault/Demo>
VaultCheckAfterReg=1

# ---------- Multi-server mapping ----------
MappingFile=/local/notesdata/bulkreg/config/server_mapping.csv

# ---------- Batch selection (BulkReg\02 - Build Batch) ----------
# Optional extra @formula ANDed with the built-in selection, e.g. a wave or pilot:
#   ExtraSelection=Department = "IT-Pilot"
ExtraSelection=
# Max documents returned by the directory search (0 = no limit). Keep 0 for 5000+ users:
# a limit of 5000 would stop Preflight and Verify at the 5000th user.
MaxScan=0
# Users per batch file built by Agent 02 (1000 = one numbered mail folder per batch)
BatchSize=1000
# 01 - Preflight always PLANS all candidates (home server, batch number, mail folders) and writes the split
# into batches and servers to _batchplan.txt. How many users it checks in detail and writes to the audit CSV:
#   PreflightScope=ALL (default)   -> EVERY candidate (5000 users = 5000 audit rows, all with FullNameAfter)
#   PreflightScope=BATCH           -> only batch number PreflightBatchNo (quick look at one batch)
# Every run re-reads names.nsf, so users that DirSync added since the last run appear automatically; users
# already in an OPEN batch file (no _results.csv yet) are left out and counted as "in open batch".
PreflightScope=ALL
PreflightBatchNo=1
# 02 - Build Batch builds ALL batches in one run: BATCH-<run>-01.csv, -02.csv ... of BatchSize rows each.
# BuildMaxBatches limits one run to that many files (0 = all). 02 skips users in open batches, so a second
# run only builds files for users that are not yet in any open batch (e.g. users added by a later DirSync).
BuildMaxBatches=0
# Optional: build a batch only for users mapped to this home server. NOT needed with the HomeServers
# pool (every batch already contains both servers); only for fixed one-server-per-wave rules.
#   BatchServerFilter=DominoADMail2/Demo   (or CN=DominoADMail2/O=Demo)
BatchServerFilter=
# SAFETY NET only. Normal case: a user with no Internet address in AD gets <shortname>@<InternetDomain>
# (ConstructInternetAddress=1 + InternetDomain set) and this setting is never used.
# It applies only to a user who still has NO address after that, i.e. when InternetDomain is empty,
# ConstructInternetAddress=0, or the ShortName is missing or contains characters not allowed in an address.
#   1 = SKIP and flag them (default): not put into a batch, listed in
#       BATCH-<id>_skipped_no_internet_address.csv and in the log view "7. Skipped - no Internet
#       address" (result SKIPPED_NO_INET). Once the address exists in AD and DirSync has written it,
#       the next Build Batch offers the user again. 03 - Register Batch also skips them.
#   0 = register them anyway without an Internet address (flagged as WARN)
SkipNoInternetAddress=1
# Folder for batch files (BATCH-<id>.csv, _summary.txt, _results.csv, _dryrun_*.csv, _verify_*.csv)
BatchDir=/local/notesdata/bulkreg/batches/

# ---------- Batch registration (BulkReg\03 - Register Batch) ----------
# Agent 03 refuses batch files with more Include=Y rows than this (keep >= BatchSize)
MaxBatchRows=1000
# Pause between users (milliseconds)
PauseMs=500
# Stop the run after this many consecutive failures
MaxConsecutiveErrors=5

# ---------- Safety: DryRun ----------
# DryRun decides whether 03 - Register Batch REALLY registers or only SIMULATES.
#   1 = DRY RUN (default, safe): 03 goes through every approved row of the batch file and checks it
#       exactly as for a real run (Person doc, objectGUID, validation, mail file name and folder),
#       but registers NOBODY: no Notes ID, no mail file, no change in names.nsf, nothing in the vault,
#       no password file. Each row is reported as WOULD_REGISTER in BATCH-<id>_dryrun_<run>.csv.
#       The batch stays OPEN, so you can dry-run it as often as you like.
#   0 = LIVE: 03 registers the approved rows (Notes ID + mail file + ID Vault), writes
#       BATCH-<id>_results.csv and closes the batch (DONE). You must type the batch ID to confirm.
# Only agent 03 uses DryRun. Agents 01, 02, 04 and 05 never change Domino, whatever DryRun is.
# Normal cycle: DryRun=1 -> run 03 -> check -> DryRun=0 -> run 03 -> DryRun=1 again.
# AutoSync IGNORES this key: AutoMode (section [AutoSync] below) decides between simulating and registering.
DryRun=1

# ---------- Audit & logging ----------
# Every run creates its own sub-folder here, named  <yyyy-mm-dd>_<hhnnss>_<NN-Agent>_<MODE>
#   e.g. 2026-10-05_093015_03-RegisterBatch_DRYRUN   or   2026-10-05_101500_03-RegisterBatch_LIVE-PRODUCTION
#   MODE: DRYRUN / LIVE-PRODUCTION (03 only), READ-ONLY (01 02 05), VERIFY (04), SETUP (00)
#   Contents: RUN_INFO.txt, audit CSV, debug log, (Preflight) mapping + mail folder reports,
#   (03/04) a copy of the batch results, dry-run or verify report
AuditDir=/local/notesdata/bulkreg/audit/
# DEBUG | INFO | WARN | ERROR
LogLevel=INFO
# ---------- Central BulkReg log database (REQUIRED) ----------
# A Notes database on a server (guide B15), created from the -Blank- template. BulkReg writes
# structured documents to it: one Run document per agent run (start, end, status, summary), one
# Entry per log line and one Audit document per user and action (result, home server, mail file,
# vault, replicas, batch). The database owner runs  Actions > BulkReg > 00 - Set Up Log Database
# once: it creates the categorized views (by date/run, batch, user, result, home server, problems,
# skipped users). It is the shared,
# permanent record for administrators and auditors - the CSV and .log files on the admin PC are
# local working copies. If it cannot be opened, the agents stop before reading or changing anything.
#   LogServer = server that holds the log database, e.g. DominoAdmin/Demo  (or CN=DominoAdmin/O=Demo)
#   LogDb     = its file name relative to that server's data directory, e.g. bulkreg_log.nsf
LogServer=<DominoAdmin/Demo>
LogDb=bulkreg_log.nsf

# =====================================================================
# [AutoSync] - settings of the unattended run (read only by agent 07 - AutoSync)
# Defaults are the safest values. Full explanation: docs/AUTOSYNC.md
# =====================================================================

# AutoSync REQUIRES in addition: VaultServer (every registered user is verified in the vault), a vault policy
# (DefaultPolicy or OrgPolicyAssignsVault=1), and a BatchDir that belongs to AutoSync alone (marker file AUTOSYNC_OWNED.txt,
# created automatically in an EMPTY folder; a folder that already holds BATCH-*.csv files is refused).

# ---------- Mode ----------
#   OFF     the agent does nothing (use to pause quietly; the agent can stay scheduled)
#   SHADOW  (default) builds the batch and DRY-RUNS the registration every run: it reports who WOULD be
#           registered and checks everything a dry run can check, but changes NOTHING in Domino.
#           Start here and read the daily mail for a few days.
#   LIVE    registers for real. First go-live: AutoMaxUsersPerRun=1 for a few runs, then raise it.
AutoMode=SHADOW

# The initial bulk registration (agents 01-04) must be finished and verified. Set to 1 only then.
# While 0, the agent refuses to run (it would race with the manual batches).
AutoInitialLoadDone=0

# Optional: abbreviated name the agent must run as (the signer, or "Run on behalf of"). A different
# identity stops the run. Example: AutoExpectedUser=BulkReg Service/Demo   (empty = no check)
AutoExpectedUser=

# Folder for the state files (state, lock, STOP file, quarantine and verification lists). Must be writable.
AutoStateDir=/local/notesdata/bulkreg/state/

# ---------- Selection ----------
# A new Person document is taken only after it has not changed for this many minutes, so users that DirSync is
# still filling (name, short name, address arrive in later syncs) are not registered half complete. 0 = off.
# Uses @Modified in the selection; the first run tests the formula and stops with a clear message if the server rejects it.
AutoMinAgeMinutes=60
# Maximum users per run (= batch size of one run). Never above MaxBatchRows.
AutoMaxUsersPerRun=50

# ---------- Safety gates (a gate that trips STOPS the run and sends an ALERT mail) ----------
# More eligible users than this (this run's batch + the ones left for later runs) = something unusual
# (bulk import, unfinished initial load): the run stops until an administrator raises the limit.
AutoMaxBacklog=200
# Systematic error stop: this many rows with Check=ERROR AND at least this percentage of the batch.
# (One bad user never blocks the others - he is put on backoff, see below.)
AutoErrorGateMin=5
AutoMaxErrorPct=25
# Run-time budget in minutes. Keep it BELOW the execution time limit of the Agent Manager (Server document);
# the run stops cleanly between two users and the rest is offered again by the next run.
AutoMaxRuntimeMin=8
# A stale lock file (a run that crashed) is replaced after this many minutes. It must exceed
# 2 x AutoMaxRuntimeMin + 5 (the run and its verification each have a budget of AutoMaxRuntimeMin); the agent refuses to run otherwise.
AutoLockStaleMin=45
# After this many failed runs in a row the agent writes the STOP file and pauses itself (ALERT mail).
# Delete <AutoStateDir>/STOP to resume.
AutoMaxFailedRuns=3

# ---------- Backoff and quarantine per user ----------
# A user that fails (validation ERROR in Build, FAILED in Register) is tried again after
# AutoRetryBackoffMin x 2^(attempt-1) minutes (30, 60 ...); from AutoMaxAttempts on he is held for
# AutoQuarantineHours (168 = 7 days) and then tried once more. Delete his line in
# <AutoStateDir>/autosync_quarantine.csv to retry at once. The list is the audit of who is held back and why.
AutoMaxAttempts=3
AutoRetryBackoffMin=30
AutoQuarantineHours=168

# ---------- Verification of registered users ----------
# Every user the agent registered is re-verified (vault, mail file, ACL, Notes name, cluster replicas) on each run
# until all is OK; replicas are created later by AdminP. After this many days a user that is still not OK is reported.
AutoVerifyDays=3
# 1 = correct a missing mail file title / a deviating mail file ACL automatically (the two fixes agent 04 offers). 0 = report only.
AutoFixMailTitleAcl=1

# ---------- Notification (Domino mail from the server) ----------
# People or groups, comma separated. A group is the best choice (e.g. a mail-in group of the administrators).
AutoNotifyTo=<BulkRegAdmins/Demo>
#   ERRORS    only alerts (gate stops, failed runs, failed users, verification gave up) + the daily status
#   ACTIVITY  (default) alerts + a mail whenever users were registered, backoff happened or verification finished
#   ALWAYS    a mail after every LIVE run
# SHADOW mode only sends alerts and the daily status.
AutoNotifyOn=ACTIVITY
# One status mail per day (after this hour, server time) even when nothing happened: no mail at all means the agent is not running.
AutoHeartbeatHour=7
# The same alert is mailed again only after this many hours.
AutoAlertRepeatHours=12
