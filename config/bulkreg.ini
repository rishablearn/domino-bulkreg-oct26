# =====================================================================
#  BulkReg 1.1 - Domino bulk registration of DirSync (Active Directory) users
#  Configuration file - WINDOWS template  (Linux/RHEL: bulkreg.linux.ini)
#  key=value, lines starting with # are comments.
#  Replace every <PLACEHOLDER>. Never put passwords in this file.
#  Paths may use \ or / - they are normalised for the running platform.
# =====================================================================

# ---------- Platform / run mode ----------
# Base folder used for any path key left empty below
BaseDir=C:\BulkReg\
# Headless (server agent) kill switch. 0 = server agents refuse to run.
ServerRunEnabled=0
# Headless LIVE runs only: must equal REGISTER-<yyyymmdd> of TODAY (server clock)
ServerConfirm=
# Headless Agent 02: generate initial passwords (client asks instead)
ExportGeneratePasswords=1
# Folder written into the text file column 6, as seen by the Windows admin client
ImportIDFileDir=

# ---------- Directory (names.nsf that DirSync writes into) ----------
DirectoryServer=<AdminServer/ORG>
DirectoryFile=names.nsf

# ---------- Registration ----------
# Server used for registration (normally the Domino Directory admin server)
RegistrationServer=<AdminServer/ORG>
RegistrationLog=log.nsf

# Certification: UseCA=1 -> Domino server-based CA (you must be a Registration Authority)
#                UseCA=0 -> certifier ID file (password is prompted at run time, never stored)
UseCA=1
CertifierName=<OU=Users/O=ORG or /ORG>
CertifierIDFile=C:\BulkReg\cert\<cert>.id

# Default values (overridden per user by server_mapping.csv)
DefaultHomeServer=<Mail01/ORG>
DefaultOrgUnit=
# Explicit policy whose Security Settings assign the ID Vault -> ID is deposited at registration
DefaultPolicy=</ORG-DirSync-Vault>
# Comma separated Domino groups to add users to (optional)
DefaultGroups=

ExpirationDays=730
# Password quality/strength value applied to the ID (0-16)
MinPasswordLength=8
IsNorthAmerican=1
EnforceUniqueShortName=1
StoreIDInAddressBook=0
SyncInternetPassword=0

# Mail: these AD users have no mail file / MailSystem = Other Internet Mail
CreateMailDb=0
# 1 = after registration restore original MailSystem + empty MailFile values (recommended)
PreserveMailSystem=1

# ---------- ID files & initial passwords ----------
# Local folder where the registration writes the user ID files (must exist; secure it!)
IDFileDir=C:\BulkReg\ids\
InitialPasswordLength=16
# 1 = write generated initial passwords to a SEPARATE restricted file (needed to hand IDs to users)
# 0 = do not keep passwords (reset later via ID Vault password reset)
WritePasswordFile=1
PasswordDir=C:\BulkReg\secure\

# ---------- ID Vault ----------
# Vault server used for post-registration verification (IsIDInVault)
VaultServer=<Vault01/ORG>
VaultCheckAfterReg=1

# ---------- Multi-server mapping ----------
MappingFile=C:\BulkReg\config\server_mapping.csv

# ---------- Selection & throttling ----------
# Optional extra @formula ANDed with the built-in selection, e.g. pilot:
#   ExtraSelection=Department = "IT-Pilot"
ExtraSelection=
# Max documents returned by the directory search (0 = no limit)
MaxScan=5000
# Max users registered per run
BatchSize=25
# Pause between users (milliseconds)
PauseMs=500
# Stop the run after this many consecutive failures
MaxConsecutiveErrors=5

# ---------- Safety ----------
# 1 = DRY RUN (nothing is changed).  Set to 0 only after a successful preflight + pilot.
DryRun=1

# ---------- Audit & logging ----------
AuditDir=C:\BulkReg\audit\
# DEBUG | INFO | WARN | ERROR
LogLevel=INFO
# Optional Agent Log database (created from alog4.ntf) for central logging; leave empty to skip
LogServer=<AdminServer/ORG>
LogDb=bulkreg_log.nsf
