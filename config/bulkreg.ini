# =====================================================================
#  BulkReg 1.3 - bulk registration of DirSync (Active Directory) users
#  Configuration file for the WINDOWS Domino Administrator client
#  key=value, lines starting with # are comments.
#  Replace every <PLACEHOLDER>. Never put passwords in this file.
# =====================================================================

# Base folder used for any path key left empty below
BaseDir=C:\BulkReg\

# ---------------------------------------------------------------------
# NAME FORMATS (examples use the organization "Demo")
#   Servers   : canonical  CN=DominoADMail/O=Demo   or abbreviated  DominoADMail/Demo
#               (both accepted; with an OU: CN=DominoADMail/OU=EMEA/O=Demo)
#   Certifier : O=Demo  (organization)  or  OU=Sales/O=Demo  (organizational unit)
#   Policies  : organizational  */Demo  or  */Sales/Demo  -> applied AUTOMATICALLY at
#                 registration to users under that org / OU (leave Policy empty)
#               explicit        */DirSync-Vault          -> must be named in Policy
# ---------------------------------------------------------------------

# ---------- Directory (names.nsf that DirSync writes into) ----------
# e.g. DirectoryServer=CN=DominoAdmin/O=Demo   or   DirectoryServer=DominoAdmin/Demo
DirectoryServer=<DominoAdmin/Demo>
DirectoryFile=names.nsf

# ---------- Registration ----------
# Server used for registration (the server holding the master Domino Directory)
# e.g. RegistrationServer=CN=DominoAdmin/O=Demo
RegistrationServer=<DominoAdmin/Demo>
RegistrationLog=log.nsf

# Certification: UseCA=1 -> Domino server-based CA (your admin ID must be a Registration Authority)
#                UseCA=0 -> certifier ID file (password is prompted at run time, never stored)
UseCA=1
# CA-enabled certifier, e.g. CertifierName=O=Demo   or   CertifierName=OU=Sales/O=Demo
CertifierName=<O=Demo>
# Only when UseCA=0, e.g. CertifierIDFile=C:\BulkReg\cert\demo.id
CertifierIDFile=

# ---------- Defaults (overridden per user by server_mapping.csv) ----------
# Home server, e.g. DefaultHomeServer=CN=DominoADMail/O=Demo   or   DominoADMail/Demo
DefaultHomeServer=<DominoADMail/Demo>
# Optional OU added to the Notes name, e.g. Sales -> John Smith/Sales/Demo
DefaultOrgUnit=
# EXPLICIT policy whose Security Settings assign the ID Vault, exactly as listed in the
# Policies view, e.g. DefaultPolicy=*/DirSync-Vault
# Leave EMPTY if an ORGANIZATIONAL policy (*/Demo or */Sales/Demo) assigns the vault
DefaultPolicy=<*/DirSync-Vault>
# 1 = an organizational policy assigns the ID Vault (no explicit policy needed; no warning)
OrgPolicyAssignsVault=0
# Comma separated Domino groups to add users to (optional), e.g. DefaultGroups=BR-Users
DefaultGroups=

ExpirationDays=730
# Password quality/strength value applied to the ID (0-16)
MinPasswordLength=8
IsNorthAmerican=1
EnforceUniqueShortName=1
StoreIDInAddressBook=0
SyncInternetPassword=0

# ---------- Mail (what happens to the user's mailbox) ----------
# DirSync users usually keep their mailbox OUTSIDE Domino (Exchange, Microsoft 365, Gmail...).
# Their Person document says: Mail system = "Other Internet Mail", Mail file = empty,
# and mail is delivered to their Internet address. They only need a Notes ID.
#
# CreateMailDb - should registration create a Domino mail file (mailbox) for each user?
#   0 = NO  (default) - users keep their mailbox where it is today; only a Notes ID is created
#   1 = YES - a Domino mail file mail\<shortname>_<noteid>.nsf is created on the user's home server
#             and the user becomes a Domino (Notes) mail user. Needs "Create databases" rights there.
CreateMailDb=0
#
# PreserveMailSystem - only used when CreateMailDb=0.
#   Registration can switch the Person document to "Notes" mail with a mail file path even though
#   no mail file was created. Domino would then try to deliver the user's mail to a mailbox that
#   does not exist. With 1, BulkReg checks the Person document right after registration and puts
#   back the values it had BEFORE (e.g. Mail system = Other Internet Mail, Mail file = empty).
#   1 = YES (default, recommended) - mail keeps flowing to the external mailbox exactly as before
#   0 = NO  - leave whatever registration wrote (only if you will set the mail fields yourself)
#   Before/after values are recorded per user in the audit (MailSystemBefore / MailSystemAfter).
PreserveMailSystem=1

# ---------- ID files & initial passwords ----------
# Local folder where the registration writes the user ID files (must exist; secure it!)
IDFileDir=C:\BulkReg\ids\
InitialPasswordLength=16
# 1 = write generated initial passwords to a SEPARATE restricted file (needed to hand IDs to users)
# 0 = do not keep passwords (reset later via ID Vault password reset)
WritePasswordFile=1
PasswordDir=C:\BulkReg\secure\

# ---------- ID Vault ----------
# Vault server used for post-registration verification (IsIDInVault)
# e.g. VaultServer=DominoVault/Demo   (use the server name as shown in the vault document)
VaultServer=<DominoVault/Demo>
VaultCheckAfterReg=1

# ---------- Multi-server mapping ----------
MappingFile=C:\BulkReg\config\server_mapping.csv

# ---------- Batch selection (BulkReg\02 - Build Batch) ----------
# Optional extra @formula ANDed with the built-in selection, e.g. a wave or pilot:
#   ExtraSelection=Department = "IT-Pilot"
ExtraSelection=
# Max documents returned by the directory search (0 = no limit)
MaxScan=5000
# Users per batch file built by Agent 02
BatchSize=500
# Optional: build a batch only for users mapped to this home server (one server per wave)
#   BatchServerFilter=DominoADMail2/Demo   (or CN=DominoADMail2/O=Demo)
BatchServerFilter=
# Folder for batch files (BATCH-<id>.csv, _summary.txt, _results.csv, _dryrun_*.csv, _verify_*.csv)
BatchDir=C:\BulkReg\batches\

# ---------- Batch registration (BulkReg\03 - Register Batch) ----------
# Agent 03 refuses batch files with more Include=Y rows than this
MaxBatchRows=1000
# Pause between users (milliseconds)
PauseMs=500
# Stop the run after this many consecutive failures
MaxConsecutiveErrors=5

# ---------- Safety ----------
# 1 = DRY RUN (nothing is changed).  Set to 0 only after a successful preflight + pilot.
DryRun=1

# ---------- Audit & logging ----------
AuditDir=C:\BulkReg\audit\
# DEBUG | INFO | WARN | ERROR
LogLevel=INFO
# Optional Agent Log database (created from alog4.ntf) for central logging; leave empty to skip
LogServer=
LogDb=
